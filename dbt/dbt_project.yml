name: neurolake
version: "0.1.0"
config-version: 2
profile: neurolake

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Root of the lake; bronze Parquet lives under <lake>/bronze.
  lake_dir: "{{ env_var('NEUROLAKE_LAKE', '../data/lake') }}"

models:
  neurolake:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  neurolake:
    +schema: reference
