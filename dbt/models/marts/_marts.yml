version: 2

models:
  - name: dim_dataset
    description: One row per dataset at its current snapshot.
    columns:
      - name: dataset_id
        tests: [unique, not_null]
      - name: dataset_type
        description: raw unless dataset_description.json says derivative (or cannot be read).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [raw, derivative, study]

  - name: dim_subject
    description: >
      Every subject that appears in participants.tsv or in the data. The two flags
      make mismatches between them queryable rather than silently dropped.
    columns:
      - name: subject_id
        tests: [unique, not_null]
      - name: dataset_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_dataset')
                field: dataset_id

  - name: fct_scan
    description: >
      One row per primary data file, with inherited acquisition metadata resolved.
      Implausible values are reported as fct_dq_issue rows, not test failures, so one
      messy dataset never blocks the rest.
    columns:
      - name: data_file_id
        tests: [unique, not_null]
      - name: subject_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subject')
                field: subject_id

  - name: fct_dq_issue
    description: Data-quality findings, one row per issue. Rules are described in the dq_rules seed.
    columns:
      - name: issue_id
        tests: [unique, not_null]
      - name: severity
        tests:
          - accepted_values:
              arguments:
                values: [error, warning, info]
      - name: rule_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dq_rules')
                field: rule_id

  - name: mart_dataset_quality
    description: Dataset-level size, coverage and readiness score.
    columns:
      - name: dataset_id
        tests: [unique, not_null]
      - name: clean_scan_pct
        tests:
          - value_in_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_acquisition_summary
    description: Acquisition parameters per dataset, datatype and task.
