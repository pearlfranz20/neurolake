[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurolake"
version = "0.1.0"
description = "Lakehouse pipeline for BIDS neuroimaging metadata: OpenNeuro ingest, DuckDB bronze layer, dbt models and data-quality marts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pearl Franz" }]
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=15",
  "httpx>=0.27",
  "typer>=0.12",
  "pathspec>=0.12",
  "dbt-core>=1.10",
  "dbt-duckdb>=1.9",
  # DuckDB needs numpy to run the Python functions registered by neurolake.dbt_plugin
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
neurolake = "neurolake.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/neurolake"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: typer declares CLI options as call defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The report embeds its stylesheet and HTML fragments verbatim.
"src/neurolake/report.py" = ["E501"]
"audit/render.py" = ["E501"]
"audit/datasets.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
